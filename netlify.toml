[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/guides/*"
  to = "/guides/:splat"
  status = 200

# Cache static assets for fast performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/components/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
